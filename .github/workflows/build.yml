name: Build TWRP PD2502 (fox_16.0)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Show disks
        run: |
          df -h
          echo "=== mounts ==="
          mount | grep -E ' / | /mnt | /home ' || true
          echo "=== du /usr/local ==="
          du -sh /usr/local/* 2>/dev/null | sort -h | tail -10 || true

      - name: Free disk space (proven action)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Prepare workspace on /mnt and verify capacity
        run: |
          sudo mkdir -p /mnt/work
          sudo chown -R $USER:$USER /mnt/work
          df -h / /mnt
          AVAIL=$(df -Pm /mnt | awk 'NR==2{print $4}')
          echo "mnt avail MB = $AVAIL"
          if [ "$AVAIL" -lt 25000 ]; then
            echo "::warning:: /mnt too small ($AVAIL MB) - A16 full tree will not fit"
          fi

      - name: Setup repo + sync
        run: |
          mkdir -p ~/bin && curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=$HOME/bin:$PATH
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global http.postBuffer 524288000
          cd /mnt/work
          ~/bin/repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0 --depth=1 --no-clone-bundle
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --fail-fast
          df -h /mnt
          du -sh /mnt/work 2>/dev/null || true
          rm -rf /mnt/work/.repo
          df -h /mnt

      - name: Place device tree
        run: |
          mkdir -p /mnt/work/device/vivo
          cp -r $GITHUB_WORKSPACE/device-tree/device/vivo/PD2502 /mnt/work/device/vivo/PD2502

      - name: Build vendor_boot
        run: |
          cd /mnt/work
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_PD2502-eng
          mka vendorbootimage -j$(nproc)
          df -h /mnt

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          cp /mnt/work/out/target/product/PD2502/vendor_boot.img $GITHUB_WORKSPACE/out/ 2>/dev/null || true
          cp /mnt/work/out/target/product/PD2502/recovery.img    $GITHUB_WORKSPACE/out/ 2>/dev/null || true
          ls -l $GITHUB_WORKSPACE/out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PD2502-recovery
          path: out/
          if-no-files-found: warn
