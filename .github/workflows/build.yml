name: Build TWRP PD2502 (fox_16.0)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Setup repo + sync (TWRP-Test twrp-16.0)
        run: |
          mkdir -p ~/bin && curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          mkdir -p ~/work && cd ~/work
          ~/bin/repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0 --depth=1
          ~/bin/repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Place device tree
        run: |
          mkdir -p ~/work/device/vivo
          cp -r $GITHUB_WORKSPACE/device-tree/device/vivo/PD2502 ~/work/device/vivo/PD2502

      - name: Build recovery
        run: |
          cd ~/work
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_PD2502-eng
          mka recoveryimage -j$(nproc) || mka vendorbootimage -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PD2502-recovery
          path: |
            ~/work/out/target/product/PD2502/recovery.img
            ~/work/out/target/product/PD2502/vendor_boot.img
          if-no-files-found: warn
